<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Food Store</title>
</head>
<body>

    <main class="login-container">
        <form id="form-login" class="login-form">
            <h2>Iniciar Sesión</h2>
            
            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="******">
            </div>

            <p id="error-message" class="error-txt" style="color: red; display: none;"></p>

            <button type="submit" class="btn-login">Ingresar</button>
            
            <p class="auth-link">¿No tenés cuenta? <a href="../register/register.html">Registrate acá</a></p>
        </form>
    </main>

    <script type="module" src="./login.ts"></script>
</body>
</html>
