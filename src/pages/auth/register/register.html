<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Food Store</title>
</head>
<body>

    <main class="login-container">
        <form id="form-registro" class="login-form">
            <h2>Crear Cuenta</h2>
            
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" required placeholder="Tu nombre">
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" required placeholder="Tu apellido">
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" required placeholder="ejemplo@correo.com">
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
            </div>

            <p id="error-message" class="error-txt" style="color: red; display: none;"></p>

            <button type="submit" class="btn-login">Registrarse</button>
            
            <p class="auth-link">¿Ya tenés cuenta? <a href="../login/login.html">Iniciá sesión acá</a></p>
        </form>
    </main>

    <script type="module" src="./register.ts"></script>
</body>
</html>
